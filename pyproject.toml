[project]
name = "articlebook"
version = "0.1.0"
description = "Multi-agent article/book generation with CrewAI and LaTeX (HW3)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=0.86.0",
    "crewai-tools>=0.17.0",
    "matplotlib>=3.8.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
articlebook = "articlebook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/articlebook"]

[tool.hatch.build.targets.wheel.sources]
"src/articlebook" = "articlebook"

[tool.hatch.build.targets.sdist]
include = ["src/articlebook", "skills", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
