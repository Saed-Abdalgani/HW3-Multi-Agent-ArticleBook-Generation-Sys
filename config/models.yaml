# M7 — model + gatekeeper defaults (env vars override for secrets and hotfixes).
# See `src/articlebook/shared/config.py` for merge rules.
version: "1"

provider: openai
model: gpt-4-turbo
temperature: 0.7
seed: 42

# Passed to CrewAI `LLM(timeout=...)` when supported (seconds).
timeout_seconds: 120

rag:
  enabled: false

gatekeeper:
  instrumented: true
  retry_max_attempts: 4
  retry_base_delay_s: 0.8
  retry_max_delay_s: 30.0
  # Minimum wall time between LLM calls (soft backpressure); 0 disables.
  rate_limit_min_interval_s: 0.0

# Rough USD per 1M tokens for *logging estimates only* (not billing).
pricing_per_million_tokens:
  default:
    input: 10.0
    output: 30.0
  gpt-4-turbo:
    input: 10.0
    output: 30.0
  gpt-4o:
    input: 2.5
    output: 10.0
